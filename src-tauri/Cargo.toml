[package]
name = "roll"
version = "0.0.1"
description = "Record once. Hand the agent a queryable pack."
authors = ["Stuart Mason"]
edition = "2021"
license = "MIT"
repository = "https://github.com/StuMason/roll"

[lib]
name = "roll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# one-click crunch (#19): multipart upload + job polling, streamed from disk
reqwest = { version = "0.13", features = ["multipart", "json", "stream"] }
tokio = { version = "1", features = ["fs", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
# the ignored crunch e2e test drives the live upload/poll loop
tokio = { version = "1", features = ["rt", "macros"] }
