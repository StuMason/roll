[package]
name = "roll"
version = "0.0.1"
description = "Record once. Hand the agent a queryable pack."
authors = ["Stuart Mason"]
edition = "2021"
license = "MIT"
repository = "https://github.com/StuMason/roll"

[lib]
name = "roll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
