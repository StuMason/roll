name: Release

# Tag a version (e.g. v0.0.1) to build signed-able artifacts for every
# desktop platform. macOS is a UNIVERSAL binary (Intel + Apple Silicon),
# built on a real macOS runner because that's the only place it can be.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action creates a GitHub release + uploads assets, which needs write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            target: linux
            rust-targets: ""
            args: ""
          - platform: windows-latest
            target: windows
            rust-targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Tauri Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Roll ${{ github.ref_name }}"
          releaseBody: "Universal macOS, Windows and Linux builds."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
